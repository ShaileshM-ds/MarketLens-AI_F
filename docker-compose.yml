name: marketlens

x-app-env: &app-env
  MONGO_URI: mongodb://mongo:27017
  MONGO_DB_DEMO: ${MONGO_DB_DEMO:-marketlens_demo}
  MONGO_DB_IMPORTED: ${MONGO_DB_IMPORTED:-marketlens_imported}
  MONGO_DB_LIVE: ${MONGO_DB_LIVE:-marketlens_live}
  MONGO_DB_ACCOUNTS: ${MONGO_DB_ACCOUNTS:-marketlens_accounts}
  LIVE_PROVIDER_ENABLED: ${LIVE_PROVIDER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-3}
      DEMO_EXPORT_DIR: /exports
    volumes:
      # Demo generator output (CSV + separate answer key) for people to inspect.
      - ./data/demo-export:/exports
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
